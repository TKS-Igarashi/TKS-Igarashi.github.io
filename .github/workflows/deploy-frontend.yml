name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
    workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理が重ならないようｎする（実行中のデプロイは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
      steps:
        - uses: actions/checkout@v5

        - name: Set up JDK
          users: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: "21"
            cache: sbt

        - name: Set up sbt
          uses: sbt/setup-sbt@v1

        - name: Set up Node.js
          uses: actions/setup-node@v5
          with:
            node-version: "24"
            cache: npm
            cache-dependency-path: frontend/package-lock.json

        - name: Install dependencies
          run: npm ci

        # vite-plugin-scalajs が内部で sbt fullLinkJS を実行する
        - name: Build
          run: npm run build

        # GitHub Pages は SPA の直接アクセスに対応していないため、404 時も index.html を返す
        - name: Add SPA fallback
          run: cp dist/index.html dist/404.html

        - uses: actions/configure-pages@v5

        - uses: actions/upload-pages-artifact@v4
          with:
            path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4